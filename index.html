<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Azure Dice Roller</title>
  <style>
    :root { font-family: system-ui, sans-serif; }
    body { max-width: 520px; margin: 2rem auto; padding: 0 1rem; text-align: center; }
    .die { font-size: 4rem; margin: 1rem; display: inline-block; min-width: 80px; }
    button { margin: 0.4rem; padding: 0.6rem 1.2rem; font-size: 1rem; cursor: pointer; }
    #status { margin-top: 1.5rem; padding: 0.8rem; border-radius: 8px; background: #f0f0f0; }
    .error { background: #fee; color: #900; }
    .ok { background: #efe; color: #060; }
  </style>
</head>
<body>
  <h1>🎲 Azure Dice Roller</h1>
  <p>All random numbers come from the remote REST API.</p>

  <div>
    <button onclick="roll(6)">d6</button>
    <button onclick="roll(20)">d20</button>
    <button onclick="rollMany(6, 2)">2d6</button>
    <button onclick="demonstrateCorsFailure()">Demonstrate CORS Failure</button>
  </div>

  <div id="results" class="die">–</div>
  <div id="status">Ready</div>

  <script>
    const API_BASE = 'https://purple-pebble-09f45d910.4.azurestaticapps.net';

    // 1. Asynchronously wake the Node.js server as soon as the page loads
    (async function wakeServer() {
      setStatus('Waking up the Node.js server…', false);
      try {
        const res = await fetch(`${API_BASE}/api/wakeup`);
        const data = await res.json();
        setStatus(`Server awake: ${data.message} (${data.timestamp})`, true);
      } catch (err) {
        setStatus(`Wake-up failed: ${err.message}`, false);
      }
    })();

    async function roll(sides) {
      setStatus(`Rolling d${sides}…`, false);
      try {
        // All random numbers come from the remote API
        const res = await fetch(`${API_BASE}/api/roll/${sides}`);
        const data = await res.json();
        document.getElementById('results').textContent = data.value;
        setStatus(`Rolled ${data.value} on a d${sides}`, true);
      } catch (err) {
        setStatus(`Error: ${err.message}`, false);
      }
    }

    async function rollMany(sides, count) {
      setStatus(`Rolling ${count}d${sides}…`, false);
      try {
        const res = await fetch(`${API_BASE}/api/roll-many?sides=${sides}&count=${count}`);
        const data = await res.json();
        document.getElementById('results').textContent = data.rolls.join(' + ') + ' = ' + data.total;
        setStatus(`Total: ${data.total}`, true);
      } catch (err) {
        setStatus(`Error: ${err.message}`, false);
      }
    }

    // 4. Demonstrates a CORS failure condition
    async function demonstrateCorsFailure() {
      setStatus('Calling endpoint that has NO CORS headers…', false);
      try {
        // This request will be blocked by the browser
        const res = await fetch(`${API_BASE}/api/no-cors-random?min=1&max=6`);
        const data = await res.json();
        // This line will never run when called from a different origin
        document.getElementById('results').textContent = data.value;
        setStatus('Unexpected success', true);
      } catch (err) {
        document.getElementById('results').textContent = '🚫';
        setStatus(
          `CORS FAILURE (expected):\n${err.message}\n\nOpen the browser console (F12) to see the full CORS error.`,
          false
        );
      }
    }

    function setStatus(msg, ok) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = ok ? 'ok' : 'error';
    }
  </script>
</body>
</html>
